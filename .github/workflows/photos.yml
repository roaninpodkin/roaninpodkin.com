name: Add photos from issue

# Roanin opens an issue from the GitHub app on his phone (template "Add photos"),
# attaches photos, and this turns them into a Logbook album. Only open issues by
# the repository owner that carry the "photos" label are processed.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: photos
  cancel-in-progress: false

jobs:
  add:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'photos')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build album from issue
        id: album
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/photos-from-issue.mjs

      - name: Check the site still builds
        if: steps.album.outputs.added != '0'
        run: npm run build

      - name: Commit
        if: steps.album.outputs.added != '0'
        run: |
          git config user.name "logbook-bot"
          git config user.email "logbook-bot@users.noreply.github.com"
          git add src/content/logbook
          git commit -m "Logbook: add ${{ steps.album.outputs.added }} photo(s) to ${{ steps.album.outputs.album }} (#${{ github.event.issue.number }})"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Deploy
        if: steps.album.outputs.added != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

      - name: Reply and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALBUM: ${{ steps.album.outputs.album }}
          TITLE: ${{ steps.album.outputs.title }}
          ADDED: ${{ steps.album.outputs.added }}
          SKIPPED: ${{ steps.album.outputs.skipped }}
        run: |
          if [ "$ADDED" = "0" ]; then
            body="Nothing new here: every photo in this issue is already in **$TITLE**."
          else
            body="Added $ADDED photo(s) to **$TITLE**."
            if [ "$SKIPPED" != "0" ]; then body="$body $SKIPPED could not be read and were skipped."; fi
            body="$body"$'\n\n'"The site is rebuilding now; give it a couple of minutes. Album: \`/logbook/$ALBUM/\`"
          fi
          gh issue comment "${{ github.event.issue.number }}" --body "$body"
          gh issue close "${{ github.event.issue.number }}" --reason completed

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "Something went wrong adding these photos. The run log is here: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
