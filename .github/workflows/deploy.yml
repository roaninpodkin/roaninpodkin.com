name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      # Repo variable SITE_MODE controls what goes public:
      #   live         -> the Astro build in dist/
      #   anything else (default) -> the "site being built" page in construction/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ vars.SITE_MODE == 'live' && 'dist' || 'construction' }}
      # Always keep the real build as a downloadable artifact for review.
      - uses: actions/upload-artifact@v7
        if: vars.SITE_MODE != 'live'
        with:
          name: site-preview
          path: dist
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
